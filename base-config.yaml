## aliases for the command. your first one is the primary command prefix, used in help messages.
## you may want to add more to act as a drop-in replacement for other `giphy` bots
command_aliases: 
  - gifme
  - gif

## enable fallback to giphy/klipy/duckduckgo search? giphy and klipy need an api
## key defined below; duckduckgo needs none.
## options: giphy klipy duckduckgo
## leave empty to disallow fallback
allow_fallback: giphy

## minimum number of database entries required to prevent falling back to giphy search,
## if fallback is enabled
fallback_threshold: 1

giphy_api_key: ""
klipy_api_key: ""

## ─── gif media proxy ───────────────────────────────────────────────────────
## Instead of downloading a gif and re-uploading it to your homeserver's media
## repo (which costs disk forever), send giphy/klipy results as mxc:// URIs that
## point at a "gifproxy" — a tiny Matrix media server that only redirects to the
## provider's CDN. Nothing is stored on your homeserver. The 💾 SAVE action still
## downloads + uploads, so saved archive entries remain permanent and self-hosted.
## This also enables the Giphy/Klipy live-search tabs in the room widget.
##
## Defaults are the public instances run by the gifproxy author. To self-host
## (recommended for reliability), see https://mau.dev/gomuks/gifproxy and point
## these at your own domains.
use_media_proxy: false
giphy_proxy: giphy.mau.dev
klipy_proxy: klipy.mau.dev

## DuckDuckGo image search (unofficial, no API key required — may break if DDG changes).
## force results to gif-typed images (type:gif filter). NOTE: biases toward GIFs but does
## not strictly guarantee the gif is animated.
duckduckgo_force_gif: true

## preferred image size for duckduckgo results. bigger values avoid tiny thumbnails.
## options: Small Medium Large Wallpaper
## leave empty for no size preference (returns a mix of all sizes).
duckduckgo_size: Medium

## enable safesearch (strict) for duckduckgo results
duckduckgo_safesearch: true

## randomly choose from the top N relevance-ranked results. 1 = strict best-match;
## higher = more variety on repeat / RETRY.
duckduckgo_result_pool: 5

## allow saving messages in plain-text to the database? security risk for encrypted rooms!
allow_non_files: true

## define a list of users who can save messages to the database?
restrict_users: false

allowed_users:
  - "@user1:server.tld"
  - "@user2:server.tld"

## try to decrypt image/file events in encrypted rooms when saving? requires mautrix
## crypto (e2ee). decrypted media is re-uploaded unencrypted to the homeserver and
## stored/resent as plain mxc. set to true to allow saving from encrypted rooms.
decryption_for_save: false

## react to a message with one of these keys to run a gif search using that
## message's text as the query, as if you had sent `!gifme <message text>`.
## keys may be emoji or text reactions; text matching is case-insensitive.
## leave the list empty to disable the react-to-search feature.
react_search_triggers:
  - "🖼️"
  - "🎬"
  - "gif"

## web archive / widget interface
## serve a paginated, searchable web gallery of all saved entries, which can also
## be embedded as a Matrix widget (click a gif to send it to the room). requires
## maubot's webapp support (webapp: true in maubot.yaml).
web_enabled: true

## number of entries shown per page in the gallery
web_page_size: 60

## how long a `!gifme magiclink` login link stays valid, in seconds (single-use)
web_magiclink_ttl: 300

## how long a browser/widget session stays valid once authenticated, in seconds
web_session_ttl: 604800

## if true, only users in the allowed_users list above may view the web archive
## (the `restrict_users` setting also implies this)
web_restrict_to_allowed_users: false

## override the public base URL for web links/widget. leave empty to auto-detect
## from maubot's configured public_url. set this if auto-detection is wrong (e.g.
## behind a reverse proxy with a different external hostname).
base_url: ""
