## aliases for the command. your first one is the primary command prefix, used in help messages.
## you may want to add more to act as a drop-in replacement for other `giphy` bots
command_aliases: 
  - gifme
  - gif

## enable fallback to giphy/klipy/duckduckgo search? giphy and klipy need an api
## key defined below; duckduckgo needs none.
## options: giphy klipy duckduckgo
## leave empty to disallow fallback
allow_fallback: giphy

## minimum number of database entries required to prevent falling back to giphy search,
## if fallback is enabled
fallback_threshold: 1

giphy_api_key: ""
klipy_api_key: ""

## DuckDuckGo image search (unofficial, no API key required — may break if DDG changes).
## force results to gif-typed images (type:gif filter). NOTE: biases toward GIFs but does
## not strictly guarantee the gif is animated.
duckduckgo_force_gif: true

## enable safesearch (strict) for duckduckgo results
duckduckgo_safesearch: true

## randomly choose from the top N relevance-ranked results. 1 = strict best-match;
## higher = more variety on repeat / RETRY.
duckduckgo_result_pool: 5

## allow saving messages in plain-text to the database? security risk for encrypted rooms!
allow_non_files: true

## define a list of users who can save messages to the database?
restrict_users: false

allowed_users:
  - "@user1:server.tld"
  - "@user2:server.tld"

## try to decrypt image/file events in encrypted rooms when saving? requires mautrix
## crypto (e2ee). decrypted media is re-uploaded unencrypted to the homeserver and
## stored/resent as plain mxc. set to true to allow saving from encrypted rooms.
decryption_for_save: false
